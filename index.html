<!DOCTYPE html>
<html lang="es" class="transition-colors duration-200">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Partes HMC COSSMIL</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style type="text/tailwindcss">
@layer components{
.inp{@apply w-full border border-slate-300 dark:border-slate-700 rounded-lg p-1.5 bg-white dark:bg-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-blue-600}
.lbl{@apply text-[10px] block font-semibold text-slate-600 dark:text-slate-400}
.sec{@apply bg-white dark:bg-slate-900 rounded-b-lg shadow p-4 border border-slate-200 dark:border-slate-800}
.box{@apply border border-slate-200 dark:border-slate-700 rounded-lg p-2.5}
.hbtn{@apply text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow flex items-center gap-1.5 transition}
}
</style>
<style>
.active-tab{border-bottom:3px solid #1e3a8a;color:#1e3a8a;font-weight:700;background:#f8fafc}
.dark .active-tab{border-bottom:3px solid #3b82f6;color:#60a5fa;background:#0f172a}
@media print{header,nav,.no-print{display:none!important}#view-centralizado{display:block!important;padding:0!important}}
#hostPrint{display:none}
@media print{body.ph>*:not(#hostPrint){display:none!important}body.ph #hostPrint{display:block!important;max-width:640px;margin:0 auto}}
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">

<header class="bg-slate-900 dark:bg-slate-950 text-white shadow-md border-b-4 border-blue-800 p-3">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
<div class="flex items-center gap-3 w-full md:w-auto">
<div class="logo w-12 h-12 rounded-full overflow-hidden bg-white border-2 border-blue-400 shadow-[0_0_12px_rgba(59,130,246,0.5)] flex-shrink-0 flex items-center justify-center text-blue-900"></div>
<section id="view-historial" class="sec hidden">
<div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3 mb-3">
<div><h2 class="font-black uppercase text-xs sm:text-sm"><i class="fa-solid fa-clock-rotate-left text-purple-600 dark:text-purple-400"></i> Historial de Partes Generales</h2>
<p class="text-[10px] text-slate-500 dark:text-slate-400">Cada jornada se archiva sola al cerrar (00:00 o Nuevo Día)</p></div>
<button onclick="cargarHistorial()" class="hbtn bg-purple-700 hover:bg-purple-800"><i class="fa-solid fa-rotate"></i> Actualizar</button>
</div>
<div id="listaHistorial" class="space-y-2 text-xs"></div>
</section>
</main>

<div id="hostImg" style="position:fixed;left:-9999px;top:0;width:560px;background:#fff"></div>
<div id="hostPrint"></div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-3 z-50">
<div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto border border-slate-300 dark:border-slate-700">
<div class="bg-slate-900 text-white p-3.5 rounded-t-2xl flex justify-between items-center">
<div><h3 id="modalTitulo" class="font-black text-sm uppercase">Detalle</h3><p id="modalSub" class="text-[10px] text-slate-300"></p></div>
<button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
</div>
<div id="modalCuerpo" class="p-4 space-y-3 text-xs"></div>
<div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-b-2xl border-t border-slate-200 dark:border-slate-700 text-right">
<button onclick="cerrarModal()" class="bg-slate-800 dark:bg-slate-700 text-white font-bold px-4 py-1.5 rounded-lg text-xs">Cerrar</button>
</div>
</div>
</div>

async function guardarEdicion(i) {
  const h = historialCache[gestK], p = h.partes[i];
  const g = id => { const v = parseInt($("x_" + id).value, 10); return isNaN(v) || v < 0 ? 0 : v; };
  EF.forEach(([k]) => p[k] = g(k)); NOV.forEach(([k]) => p[k] = g(k));
  p.efectivo = EF.reduce((s, [k]) => s + p[k], 0);
  p.otrosCantidad = g("otros"); p.otrosDetalle = $("x_otrosDet").value.trim();
  p.asisten = Math.max(0, p.efectivo - NOV.reduce((s, [k]) => s + p[k], 0) - p.otrosCantidad);
  p.responsable = $("x_resp").value.trim(); p.demostracion = $("x_demo").value.trim();
  try { await persistirHist(gestK, h, { unidad: p.unidad, parte: p }); alert("✅ Parte modificado."); }
  catch (e) { alert("Error al guardar. Intente de nuevo."); }
  await cargarHistorial(); vistaGestion();
}

/* ============ INICIO ============ */
function init() {
  construirUI();
  let o = false; try { o = localStorage.getItem("hmc_modo_oscuro") === "1"; } catch (e) {}
  aplicarTema(o);
  switchTab("registro");
  reloj(); setInterval(reloj, 1000);
  recalcular();
  cargarNube(); setInterval(cargarNube, 6000);
}
document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", init) : init();
